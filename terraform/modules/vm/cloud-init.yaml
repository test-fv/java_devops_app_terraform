#cloud-config

package_update: true
package_upgrade: true

packages:
  - docker.io

bootcmd:
  - mkdir -p /home/azureuser/app

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker azureuser

  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash

  - mkdir -p /home/azureuser/app
  - chown -R azureuser:azureuser /home/azureuser/app

  - mkdir -p /home/azureuser/.azure
  - chown -R azureuser:azureuser /home/azureuser/.azure

write_files:
  - path: /home/azureuser/app/deploy.sh
    owner: azureuser:azureuser
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      ACR_NAME="$ACR_NAME"
      ACR_USER="$ACR_USER"
      ACR_PASS="$ACR_PASS"
      IMAGE="$ACR_NAME.azurecr.io/myapp:latest"

      echo "Login ACR..."
      echo $ACR_PASS | docker login $ACR_NAME.azurecr.io -u $ACR_USER --password-stdin

      echo "Pull imagen..."
      docker pull $IMAGE

      echo "Levantando nueva versión..."
      docker run -d --name myapp_new -p 8081:8080 $IMAGE

      echo "Esperando que arranque..."
      sleep 10

      echo "Validando nueva versión..."
      if curl -f http://localhost:8081; then
        echo "Nueva versión OK ✔"

        echo "Parando versión actual..."
        docker stop myapp || true
        docker rm myapp || true

        echo "Promoviendo nueva versión..."
        docker stop myapp_new
        docker rm myapp_new

        docker run -d --name myapp -p 80:8080 $IMAGE

      else
        echo "Fallo nueva versión ❌ — rollback automático"

        docker stop myapp_new || true
        docker rm myapp_new || true

        exit 1
      fi