#cloud-config

package_update: true
package_upgrade: true

packages:
  - docker.io

bootcmd:
  - mkdir -p /home/azureuser/app

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker azureuser

  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash

  - mkdir -p /home/azureuser/app
  - chown -R azureuser:azureuser /home/azureuser/app

  - mkdir -p /home/azureuser/.azure
  - chown -R azureuser:azureuser /home/azureuser/.azure

write_files:
  - path: /home/azureuser/app/deploy.sh
    owner: azureuser:azureuser
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      ACR_NAME="$ACR_NAME"
      ACR_USER="$ACR_USER"
      ACR_PASS="$ACR_PASS"
      IMAGE_NAME="myapp"
      IMAGE_TAG="$IMAGE_TAG"

      NEW_IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
      STATE_FILE="/home/azureuser/app/current_sha"

      echo "Login ACR..."

      export DOCKER_CONFIG=/tmp/docker-config
      mkdir -p $DOCKER_CONFIG

      echo $ACR_PASS | docker login $ACR_NAME.azurecr.io -u $ACR_USER --password-stdin

      # Leer SHA anterior
      PREVIOUS_SHA=""
      if [ -f "$STATE_FILE" ]; then
        PREVIOUS_SHA=$(cat $STATE_FILE)
      fi

      echo "SHA anterior: $PREVIOUS_SHA"
      echo "Nuevo SHA: $IMAGE_TAG"

      echo "Pull imagen nueva..."
      docker pull $NEW_IMAGE

      echo "Levantando nueva versión..."
      docker run -d --name myapp_new -p 8081:8080 $NEW_IMAGE

      echo "Esperando que arranque..."
      sleep 10

      echo "Validando nueva versión..."
      if curl -f http://localhost:8081/health; then
        echo "Nueva versión OK ✔"

        # Guardar nuevo SHA
        echo $IMAGE_TAG > $STATE_FILE

        echo "Eliminando versión actual..."
        docker stop myapp || true
        docker rm myapp || true

        echo "Promoviendo nueva versión..."
        docker stop myapp_new
        docker rm myapp_new

        docker run -d \
          --name myapp \
          -p 80:8080 \
          $NEW_IMAGE

        echo "Deploy exitoso 🚀"

      else
        echo "Fallo nueva versión ❌ — rollback"

        docker stop myapp_new || true
        docker rm myapp_new || true

        if [ ! -z "$PREVIOUS_SHA" ]; then
          echo "Restaurando versión anterior: $PREVIOUS_SHA"

          docker pull $ACR_NAME.azurecr.io/$IMAGE_NAME:$PREVIOUS_SHA

          docker stop myapp || true
          docker rm myapp || true

          docker run -d \
            --name myapp \
            -p 80:8080 \
            $ACR_NAME.azurecr.io/$IMAGE_NAME:$PREVIOUS_SHA

          echo "Rollback completado ✔"
        else
          echo "No hay versión previa ⚠"
        fi

        exit 1
      fi
