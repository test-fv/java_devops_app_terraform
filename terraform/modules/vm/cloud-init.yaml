#cloud-config

package_update: true
package_upgrade: true

packages:
  - docker.io

bootcmd:
  - mkdir -p /home/azureuser/app

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker azureuser

  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash

  - mkdir -p /home/azureuser/app
  - chown -R azureuser:azureuser /home/azureuser/app

  - mkdir -p /home/azureuser/.azure
  - chown -R azureuser:azureuser /home/azureuser/.azure

write_files:
  - path: /home/azureuser/app/deploy.sh
    owner: azureuser:azureuser
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      ACR_NAME="${acr_name}"
      IMAGE_NAME="myapp"

      echo "Login ACR..."
      docker login $ACR_NAME.azurecr.io -u $ACR_USER -p $ACR_PASS

      echo "Pull imagen..."
      docker pull $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

      echo "Reiniciar contenedor..."
      docker stop myapp || true
      docker rm myapp || true

      docker run -d \
        --name myapp \
        -p 80:8080 \
        $ACR_NAME.azurecr.io/$IMAGE_NAME:latest