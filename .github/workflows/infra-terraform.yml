
name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

jobs:

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      TF_VAR_location: ${{ secrets.TF_VAR_location }}
      TF_VAR_rg_name: ${{ secrets.TF_VAR_rg_name }}
      TF_VAR_vm_name: ${{ secrets.TF_VAR_vm_name }}
      TF_VAR_vm_size: ${{ secrets.TF_VAR_vm_size }}
      TF_VAR_admin_username: ${{ secrets.TF_VAR_admin_username }}
      TF_VAR_acr_name: ${{ secrets.TF_VAR_acr_name }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}

    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init -reconfigure -input=false

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/prod/tfplan


  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan

    environment:
      name: production

    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/prod

      - name: Apply Approved Plan
        run: terraform apply -auto-approve tfplan